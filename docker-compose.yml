# All secrets come from a git-ignored `.env` next to this file (template: `.env.example`).
# `${VAR:?...}` makes Compose refuse to start if a required value is missing.
#
# `ml` and `db` publish NO host ports: only the gateway reaches them, over the internal
# Compose network. For local debugging, add a git-ignored docker-compose.override.yml that
# binds to localhost only (e.g. "127.0.0.1:5432:5432") — never a bare "5432:5432".

services:
  # The ML Service (The Brain) — private, gateway-only
  ml:
    build: .
    container_name: face-api
    expose:
      - "8000"
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      ML_SERVICE_API_KEY: ${ML_SERVICE_API_KEY:?set ML_SERVICE_API_KEY in .env}
      # Format for NEW templates: 2 = int8 (production, 257 KiB), 1 = fp32 (1 MiB). Both stay readable.
      ENROL_TEMPLATE_VERSION: ${ENROL_TEMPLATE_VERSION:-2}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s      # Give the service time to download models on first run

  # Database with pgvector support — private, gateway-only
  db:
    image: pgvector/pgvector:pg16
    container_name: face-db
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped

  # Rate-limit token buckets — private, gateway-only
  redis:
    image: redis:7-alpine
    container_name: face-redis
    expose:
      - "6379"
    restart: unless-stopped

  # Local mail catcher for verification emails. Swap SMTP_* in .env for a real provider.
  # Inbox UI is on this machine only: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: face-mail
    expose:
      - "1025"
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  # NestJS Backend (The Manager) — the only public entry point
  backend:
    build: ./api-gateway
    container_name: face-gateway
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - db
      - ml
      - redis
      - mailpit
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      ML_SERVICE_URL: ${ML_SERVICE_URL:?set ML_SERVICE_URL in .env}
      ML_SERVICE_API_KEY: ${ML_SERVICE_API_KEY:?set ML_SERVICE_API_KEY in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PORTAL_ORIGIN: ${PORTAL_ORIGIN:?set PORTAL_ORIGIN in .env}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in .env}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:?set SMTP_PORT in .env}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM in .env}

volumes:
  postgres_data:
