version: '3.8'

services:
  # The ML Service (The Brain)
  ml-service:
    build: .                 # Build from the Dockerfile in the current directory
    container_name: face-api # Name the container so it's easy to find
    ports:
      - "8000:8000"          # Map port 8000 to the outside world
    restart: unless-stopped  # Auto-restart if it crashes (but not if manually stopped)
    environment:
      - PYTHONUNBUFFERED=1   # See Python logs in real-time
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s      # Give the service time to download models on first run

  # Database with pgvector support
  postgres:
    image: pgvector/pgvector:pg16
    container_name: face-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: biometric_auth
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # NestJS Backend (The Manager)
  backend:
    build: ./api-gateway     # Build from the api-gateway directory
    container_name: face-gateway
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - postgres
      - ml-service
    environment:
      # Use internal container names (face-db, face-api)
      DATABASE_URL: postgresql://user:password@face-db:5432/biometric_auth
      ML_SERVICE_URL: http://face-api:8000
      JWT_SECRET: super-secret-key-change-this-in-prod

volumes:
  postgres_data: